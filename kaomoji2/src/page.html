<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>颜文字图鉴</title>
<meta name="description" content="{{TOTAL}} 个颜文字，{{CATS}} 类，点一下就复制。能搜网络用语，还有捏脸机、连发剧本、举牌喊话这些好玩的小工具。">
<meta name="theme-color" content="#F4F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17161F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23FF4FA6'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' font-family='sans-serif' fill='%23fff'%3E%E3%83%BB%CF%89%E3%83%BB%3C/text%3E%3C/svg%3E">
<style>
/*KMJ:STYLE*/
</style>
<!-- ===== body ===== -->
<script>document.documentElement.lang = "zh-CN"; document.documentElement.className += " js";
try { var s = JSON.parse(localStorage.getItem("kmj2.set") || "{}"); if (s.theme && s.theme !== "auto") document.documentElement.setAttribute("data-theme", s.theme); if (s.size) document.documentElement.setAttribute("data-size", s.size); if (s.safe) document.documentElement.className += " safe"; } catch (e) {}</script>

<div class="app">
  <aside class="side" aria-label="目录">
    <a class="brand" href="#top">
      <span class="brand-face" aria-hidden="true">(・ω・)</span>
      <span class="brand-name">颜文字图鉴</span>
    </a>
    <nav class="side-tabs js-only" aria-label="页面">
      <a class="stab" href="#top" data-tab="lib"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5A1.5 1.5 0 0 1 4 17.5zM13 4h5.5c.8 0 1.5.7 1.5 1.5v12c0 .8-.7 1.5-1.5 1.5H13z"/></svg>图鉴</a>
      <a class="stab" href="#lab" data-tab="lab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5.2 8.7A2.2 2.2 0 0 0 6.7 21h10.6a2.2 2.2 0 0 0 1.9-3.3L14 9V3"/><path d="M7.5 15h9"/></svg>实验室</a>
      <a class="stab" href="#me" data-tab="me"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>我的<b class="tab-badge" hidden></b></a>
    </nav>
    <div class="toc" id="toc">
<!--KMJ:TOC-->
    </div>
  </aside>

  <div class="main">
    <header class="hero" id="top">
      <div class="hero-text">
        <p class="kicker">kaomoji · 颜文字</p>
        <h1 class="title" data-text="颜文字图鉴">颜文字图鉴</h1>
        <p class="sub"><b class="num" id="total">{{TOTAL_FMT}}</b> 张脸，{{CATS}} 类，点一下就复制</p>
      </div>
      <div class="hero-pal js-only">
        <button class="mascot" id="mascot" type="button" aria-label="戳一下 ω 酱"><span class="mascot-face" id="mascotFace">(・ω・)</span></button>
        <p class="bubble" id="bubble" aria-live="polite">点一下就复制</p>
      </div>
      <span class="badge-new" aria-hidden="true">新版<br>试做中</span>
    </header>

    <div class="bar" id="bar">
      <div class="bar-row js-only">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
          <input id="q" type="search" placeholder="搜：开心 / 哭 / 猫 / 笑死 / 晚安" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="搜索颜文字">
          <button class="q-clear" id="qClear" type="button" aria-label="清空搜索" hidden>×</button>
        </label>
        <button class="ibtn ibtn-dice" id="dice" type="button" title="随机来一张" aria-label="随机来一张"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.4"/><circle cx="15" cy="15" r="1.4"/><circle cx="15" cy="9" r="1.4"/><circle cx="9" cy="15" r="1.4"/></svg></button>
      </div>
      <nav class="chips" id="chips" aria-label="分类">
        <button class="chip chip-toc js-only" id="tocBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>目录</button>
<!--KMJ:CHIPS-->
      </nav>
    </div>

    <main class="views">
      <section class="view" id="v-lib" data-view="lib">
        <div class="results" id="results" hidden></div>
        <div class="lib" id="lib">
<!--KMJ:SECTIONS-->
        </div>
      </section>
      <section class="view" id="v-lab" data-view="lab" hidden></section>
      <section class="view" id="v-me" data-view="me" hidden></section>
    </main>

    <footer class="foot">
      <p>颜文字是用各种文字里的符号拼出来的脸：ω 是希腊字母，Д 是俄文字母，๑ 是泰文数字。对方手机缺字体时，少见的符号会显示成方框 □，重要场合挑常见一点的更稳。</p>
      <p class="noscript-tip">现在没有运行脚本：每张脸都能长按选中复制，用上面的分类跳转。</p>
      <p>旧版还在：<a href="https://peipei707.github.io/kaomoji/">颜文字小铺</a></p>
    </footer>
  </div>
</div>

<nav class="tabbar js-only" id="tabbar" aria-label="页面">
  <a class="tab" href="#top" data-tab="lib"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5A1.5 1.5 0 0 1 4 17.5zM13 4h5.5c.8 0 1.5.7 1.5 1.5v12c0 .8-.7 1.5-1.5 1.5H13z"/></svg><span>图鉴</span></a>
  <a class="tab" href="#lab" data-tab="lab"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5.2 8.7A2.2 2.2 0 0 0 6.7 21h10.6a2.2 2.2 0 0 0 1.9-3.3L14 9V3"/><path d="M7.5 15h9"/></svg><span>实验室</span></a>
  <a class="tab" href="#me" data-tab="me"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>我的</span><b class="tab-badge" hidden></b></a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 class="sheet-title" id="sheetTitle"></h2>
    <button class="sheet-x" id="sheetX" type="button" aria-label="关闭">×</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="stage" id="stage" hidden>
  <div class="stage-face" id="stageFace"></div>
  <p class="stage-tip">点一下换个颜色 · 右上角退出</p>
  <button class="stage-x" id="stageX" type="button" aria-label="退出">×</button>
</div>
